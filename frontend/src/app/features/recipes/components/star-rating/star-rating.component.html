<!-- Conteneur des 5 étoiles. La classe .readonly désactive le curseur pointeur via CSS. -->
<div class="star-rating" [class.readonly]="readonly()">

  @for (star of stars; track star) {
    <!-- Chaque étoile est un bouton (accessibilité clavier) -->
    <button
      type="button"
      class="star-btn"
      [attr.aria-label]="'Donner ' + star + (star > 1 ? ' étoiles' : ' étoile')"
      (click)="select(star)"
      (mouseenter)="onMouseEnter(star)"
      (mouseleave)="onMouseLeave()"
    >
      <!-- Icône Material : 'star' (pleine) ou 'star_border' (vide) selon l'état -->
      <mat-icon [class.filled]="isFilled(star)">
        {{ isFilled(star) ? 'star' : 'star_border' }}
      </mat-icon>
    </button>
  }

  <!-- Affiche "X/5" à côté des étoiles en mode interactif si une note est déjà choisie -->
  @if (!readonly() && value() > 0) {
    <span class="star-label">{{ value() }}/5</span>
  }

</div>
