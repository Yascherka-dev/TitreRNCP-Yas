<div class="star-rating" [class.readonly]="readonly()">
  @for (star of stars; track star) {
    <button
      type="button"
      class="star-btn"
      [attr.aria-label]="'Donner ' + star + (star > 1 ? ' étoiles' : ' étoile')"
      (click)="select(star)"
      (mouseenter)="onMouseEnter(star)"
      (mouseleave)="onMouseLeave()"
    >
      @if (isFilled(star)) {
        <svg class="star filled" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      } @else {
        <svg class="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
      }
    </button>
  }
  @if (!readonly() && value() > 0) {
    <span class="star-label">{{ value() }}/5</span>
  }
</div>
