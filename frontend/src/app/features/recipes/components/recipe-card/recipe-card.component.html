<mat-card class="recipe-card">

  <!-- Photo -->
  <div class="recipe-card__image">
    <img [src]="recipe().imageUrl" [alt]="recipe().title" />
    <div class="recipe-card__country-badge">
      <img [src]="recipe().flag" [alt]="recipe().country" class="badge-flag" />
      <span>{{ recipe().country }}</span>
    </div>
  </div>

  <mat-card-content>

    <!-- Titre -->
    <h3 class="recipe-card__title">{{ recipe().title }}</h3>
    <p class="recipe-card__desc">{{ recipe().description }}</p>

    <!-- Infos rapides -->
    <div class="recipe-card__meta">
      <div class="meta-item">
        <mat-icon>schedule</mat-icon>
        <span>{{ recipe().prepTime + recipe().cookTime }} min</span>
      </div>
      <div class="meta-item">
        <mat-icon>group</mat-icon>
        <span>{{ recipe().servings }} pers.</span>
      </div>
      <div class="meta-item">
        <mat-icon>bar_chart</mat-icon>
        <span>{{ recipe().difficulty }}</span>
      </div>
    </div>

    <!-- Tags -->
    <div class="recipe-card__tags">
      @for (tag of recipe().tags; track tag) {
        <mat-chip>{{ tag }}</mat-chip>
      }
    </div>

    <!-- CTA -->
    <div class="recipe-card__action">
      <button mat-flat-button color="primary" (click)="openDetail()">
        Voir la recette
      </button>
    </div>

  </mat-card-content>
</mat-card>
