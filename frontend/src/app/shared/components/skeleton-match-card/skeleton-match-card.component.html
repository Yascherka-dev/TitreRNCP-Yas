<!-- Skeleton qui reproduit la forme de MatchCard sans données réelles -->
<mat-card class="skeleton-card">
  <mat-card-content>

    <!-- Ligne compétition : logo rond + nom + round -->
    <div class="sk-league">
      <span class="sk sk--circle-sm"></span>
      <span class="sk sk--bar sk--w-lg"></span>
      <span class="sk sk--bar sk--w-xs sk--ml-auto"></span>
    </div>

    <!-- Badge statut (Live / À venir / Terminé) -->
    <span class="sk sk--pill sk--w-md"></span>

    <!-- Section équipes : domicile | score | extérieur -->
    <div class="sk-teams">
      <div class="sk-team">
        <span class="sk sk--circle-lg"></span>
        <span class="sk sk--bar sk--w-md"></span>
        <span class="sk sk--bar sk--w-sm"></span>
      </div>
      <!-- Zone score / heure centrale -->
      <span class="sk sk--score"></span>
      <div class="sk-team">
        <span class="sk sk--circle-lg"></span>
        <span class="sk sk--bar sk--w-md"></span>
        <span class="sk sk--bar sk--w-sm"></span>
      </div>
    </div>

    <!-- Actions : bouton "Voir les recettes" + icône favori -->
    <div class="sk-actions">
      <span class="sk sk--btn"></span>
      <span class="sk sk--circle-icon"></span>
    </div>

  </mat-card-content>
</mat-card>
