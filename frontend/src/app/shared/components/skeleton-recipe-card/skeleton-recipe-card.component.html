<!-- Skeleton qui reproduit la forme de RecipeCard sans données réelles -->
<mat-card class="skeleton-recipe-card">

  <!-- Bloc image (200px de hauteur, même que RecipeCard) -->
  <div class="sk sk--image"></div>

  <mat-card-content>

    <!-- Titre de la recette -->
    <span class="sk sk--bar sk--title"></span>

    <!-- Description (2 lignes) -->
    <span class="sk sk--bar sk--desc-line1"></span>
    <span class="sk sk--bar sk--desc-line2"></span>

    <!-- Méta : temps + portions + difficulté -->
    <div class="sk-meta">
      <span class="sk sk--chip"></span>
      <span class="sk sk--chip"></span>
      <span class="sk sk--chip sk--chip-sm"></span>
    </div>

    <!-- Tags -->
    <div class="sk-tags">
      <span class="sk sk--tag"></span>
      <span class="sk sk--tag sk--tag-sm"></span>
      <span class="sk sk--tag sk--tag-xs"></span>
    </div>

    <!-- Bouton "Voir la recette" -->
    <span class="sk sk--btn-full"></span>

  </mat-card-content>
</mat-card>
