<!-- Header Airbnb-style — masqué sur la landing page -->
@if (!isLanding()) {
  <header class="mm-header">
    <div class="mm-header__inner">
      <a class="mm-header__logo" routerLink="/">
        <span class="mm-header__logo-icon">🍽️</span>
        <span class="mm-header__logo-text">Match &amp; Munch</span>
      </a>

      <nav class="mm-header__nav">
        <a routerLink="/matches" routerLinkActive="active">
          <mat-icon>sports_soccer</mat-icon>
          <span class="nav-label">Matchs</span>
        </a>
        <a routerLink="/favorites" routerLinkActive="active">
          <mat-icon>favorite_border</mat-icon>
          <span class="nav-label">Favoris</span>
        </a>
      </nav>

      @if (authService.isLoggedIn()) {
        <span class="mm-header__username"> Bonjour,
          {{ authService.currentUser()?.prenom }}
        </span>
        <button
          class="mm-header__login"
          mat-stroked-button
          (click)="authService.logout()"
        >
          <mat-icon>logout</mat-icon>
          <span class="login-label">Déconnexion</span>
        </button>
      } @else {
        <a class="mm-header__login" mat-stroked-button routerLink="/login">
          <mat-icon>person_outline</mat-icon>
          <span class="login-label">Connexion</span>
        </a>
      }
    </div>
  </header>
}

<main [class.mm-main]="!isLanding()">
  <router-outlet />
</main>
