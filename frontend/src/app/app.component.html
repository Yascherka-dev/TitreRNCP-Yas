@if (!isLanding()) {
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" routerLink="/">
        <span class="mark" aria-hidden="true"></span>
        Match <span class="amp">&amp;</span> Munch
      </a>
      <nav class="nav-links" aria-label="Menu">
        <a routerLink="/matches" routerLinkActive="active">Matchs</a>
        <a routerLink="/favorites" routerLinkActive="active">Mes recettes</a>
      </nav>
      <div class="nav-spacer"></div>
      @if (authService.isLoggedIn()) {
        <span class="nav-hello">Bonjour, <strong>{{ authService.currentUser()?.prenom }}</strong></span>
        <button class="btn btn-ghost btn-sm" (click)="authService.logout()">Déconnexion</button>
      } @else {
        <a class="btn btn-primary" routerLink="/login">Connexion</a>
      }
    </div>
  </header>
}

<main [class.page-content]="!isLanding()">
  <router-outlet />
</main>

@if (!isLanding()) {
  <app-site-footer />
  <app-bottom-tab-bar />
}
