@if (!isLanding()) {
  <header class="nav">
    <div class="container nav-inner">
      <a class="logo" routerLink="/">
        <span class="mark" aria-hidden="true"></span>
        Match <span class="amp">&amp;</span> Munch
      </a>
      <nav class="nav-links" aria-label="Menu">
        <a routerLink="/matches" routerLinkActive="active">Matchs</a>
        <a routerLink="/favorites" routerLinkActive="active">Mes recettes</a>
      </nav>
      <div class="nav-spacer"></div>
      @if (authService.isLoggedIn()) {
        <app-account-menu />
      } @else {
        <a class="btn btn-primary" routerLink="/login">Connexion</a>
      }
    </div>
  </header>
}

<main [class.page-content]="!isLanding()">
  <router-outlet />
</main>

<!-- Un seul footer pour toute l'application, landing comprise.
     Sur mobile il cède la place au tab-bar — sauf sur la landing, qui n'en a
     pas : la classe le lui fait réapparaître. -->
<app-site-footer [class.on-landing]="isLanding()" />

@if (!isLanding()) {
  <app-bottom-tab-bar />
}
